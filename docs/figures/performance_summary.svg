" y1="230.8" x2="1140" y2="230.8" stroke="#e8edf5"/><text x="847" y="235.8235294117647" font-family="Segoe UI,Arial,sans-serif" font-size="11px" text-anchor="end" font-weight="400" fill="#64748b">200</text><line x1="857" y1="180.2" x2="1140" y2="180.2" stroke="#e8edf5"/><text x="847" y="185.23529411764707" font-family="Segoe UI,Arial,sans-serif" font-size="11px" text-anchor="end" font-weight="400" fill="#64748b">300</text><circle cx="857.0" cy="324.3" r="6" fill="#29a36a" stroke="#ffffff" stroke-width="3"/><text x="857.0" y="312.32070588235297" font-family="Segoe UI,Arial,sans-serif" font-size="12px" text-anchor="middle" font-weight="700" fill="#172033">15.18</text><text x="857.0" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="13px" text-anchor="middle" font-weight="400" fill="#172033">2/s</text><circle cx="998.5" cy="323.7" r="6" fill="#29a36a" stroke="#ffffff" stroke-width="3"/><text x="998.5" y="311.7288235294118" font-family="Segoe UI,Arial,sans-serif" font-size="12px" text-anchor="middle" font-weight="700" fill="#172033">16.35</text><text x="998.5" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="13px" text-anchor="middle" font-weight="400" fill="#172033">4/s</text><circle cx="1140.0" cy="181.6" r="6" fill="#e85d75" stroke="#ffffff" stroke-width="3"/><text x="1140.0" y="169.61129411764708" font-family="Segoe UI,Arial,sans-serif" font-size="12px" text-anchor="middle" font-weight="700" fill="#172033">297.28</text><text x="1140.0" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="13px" text-anchor="middle" font-weight="400" fill="#172033">8/s</text><text x="857" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="12px" text-anchor="start" font-weight="400" fill="#64748b">first-content latency (ms)</text><text x="831" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="12px" text-anchor="start" font-weight="400" fill="#475569">8/s crossed the 200 ms interaction target.</text><rect x="35" y="420" width="1129" height="270" rx="14" fill="#ffffff" stroke="#dbe3ef"/><text x="57" y="454" font-family="Segoe UI,Arial,sans-serif" font-size="18px" text-anchor="start" font-weight="700" fill="#172033">Concurrency: latency versus waiting</text><text x="60" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="15px" text-anchor="start" font-weight="400" fill="#475569">One long + one short request; median first-content latency</text><text x="60" y="512" font-family="Segoe UI,Arial,sans-serif" font-size="15px" text-anchor="start" font-weight="700" fill="#e85d75">parallel=1</text><text x="222" y="512" font-family="Segoe UI,Arial,sans-serif" font-size="15px" text-anchor="start" font-weight="700" fill="#e85d75">2851.93 ms</text><rect x="60" y="528" width="920.0" height="28" rx="8" fill="#e85d75"/><text x="60" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="15px" text-anchor="start" font-weight="700" fill="#29a36a">parallel=2</text><text x="222" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="15px" text-anchor="start" font-weight="700" fill="#29a36a">22.91 ms</text><rect x="60" y="618" width="22.91" height="28" rx="8" fill="#29a36a"/><text x="60" y="675" font-family="Segoe UI,Arial,sans-serif" font-size="13px" text-anchor="start" font-weight="400" fill="#475569">Two slots removed the long-request queue wait in this controlled comparison; shared GPU compute still needs measurement.</text></svg>